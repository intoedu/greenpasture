# 무료 요금제의 Supabase 프로젝트는 일주일 동안 사용이 거의 없으면 자동으로 멈춥니다.
# 멈춘 동안에는 홈페이지에서 문의를 넣어도 접수가 실패합니다.
# 그래서 3일마다 가볍게 한 번 찔러 깨어 있게 유지합니다.
#
# 사용 전 준비: 저장소 Settings > Secrets and variables > Actions 에 아래 두 개를 등록
#   SUPABASE_URL       예) https://xxxxxxxx.supabase.co
#   SUPABASE_ANON_KEY  공개 키 (sb_publishable_… 또는 예전 anon 키)
#
# 아직 백엔드를 연결하지 않아 시크릿이 비어 있으면, 실패로 처리하지 않고 안내만 남기고 끝냅니다.
# (실패로 끝나면 GitHub 이 3일마다 실패 알림 메일을 보내기 때문입니다)
name: Supabase keepalive

on:
  schedule:
    - cron: "17 3 */3 * *"   # 3일마다 03:17 UTC (한국시간 낮 12시 17분)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 데이터베이스 깨우기
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::notice title=Supabase 미연결::SUPABASE_URL / SUPABASE_ANON_KEY 시크릿이 아직 없습니다. 온라인 접수(Supabase)를 연결한 뒤 docs/SETUP.md 7번대로 저장소 Settings > Secrets and variables > Actions 에 두 값을 등록하십시오. 그전까지 이 작업은 아무것도 하지 않고 정상 종료합니다."
            exit 0
          fi
          URL="${URL%/}"

          # 새 방식 공개 키(sb_publishable_…)는 JWT가 아니므로 apikey 머리글에만 넣습니다.
          # 예전 anon 키(eyJ…)는 Authorization 에도 함께 넣습니다.
          case "$KEY" in
            sb_*) AUTH_ARGS=() ;;
            *)    AUTH_ARGS=(-H "Authorization: Bearer $KEY") ;;
          esac

          # 로그인하지 않은 상태로 호출하므로 아무 데이터도 돌아오지 않습니다(권한 없음 응답이 정상).
          # 목적은 데이터베이스에 '요청이 있었다'는 사실을 남기는 것뿐입니다.
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
            -H "apikey: $KEY" "${AUTH_ARGS[@]}" \
            "$URL/rest/v1/inquiries?select=id&limit=1" || true)
          echo "응답 코드: $code"
          case "$code" in
            200|401|403)
              echo "정상 — 프로젝트가 살아 있습니다." ;;
            540)
              echo "::error title=Supabase 프로젝트 정지됨::프로젝트가 멈춰 있습니다(540). Supabase 대시보드에서 해당 프로젝트를 열고 Resume project 를 눌러 되살리십시오. 정지 후 90일이 지나면 되살릴 수 없습니다."
              exit 1 ;;
            *)
              echo "::error title=Supabase 응답 이상::예상하지 못한 응답($code)입니다. 프로젝트가 멈췄거나 주소·키가 바뀌었을 수 있습니다. docs/SETUP.md 9번 문제 해결 표를 확인하십시오."
              exit 1 ;;
          esac
