# 홈페이지 자동 배포 (GitHub Pages)
# main 브랜치에 변경이 올라가면 1~2분 안에 웹사이트가 자동으로 갱신됩니다.
# 홈페이지에 필요한 파일만 골라 올립니다. (docs/, supabase/ 등 작업용 파일은 웹에 올라가지 않습니다)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v4

      - name: 배포할 파일만 모으기
        run: |
          mkdir -p _site
          cp ./*.html robots.txt sitemap.xml .nojekyll _site/
          cp -r assets _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
          echo "배포 파일 목록:"; find _site -maxdepth 2 -type f | sort

      - name: 내부 검토 메모 지우기
        # data-tbd="…" 는 제작 중 확인할 내용을 적어 둔 메모입니다. 공개 사이트에는 싣지 않습니다.
        # 고객과 ?review 검토 모드로 함께 볼 때만 저장소 변수 KEEP_REVIEW_NOTES 를 true 로 두십시오.
        #   (Settings → Secrets and variables → Actions → Variables)
        env:
          KEEP_REVIEW_NOTES: ${{ vars.KEEP_REVIEW_NOTES }}
        run: |
          if [ "$KEEP_REVIEW_NOTES" = "true" ]; then
            echo "::notice::KEEP_REVIEW_NOTES=true — 검토 메모를 남긴 채 배포합니다."
            exit 0
          fi
          find _site -type f \( -name '*.html' -o -name '*.js' \) -print0 | xargs -0 perl -0pi -e 's/\s+data-tbd="[^"]*"//g'
          if grep -rl 'data-tbd="' _site; then echo "::error::검토 메모가 남아 있습니다"; exit 1; fi
          echo "검토 메모를 모두 지웠습니다."


      - name: Pages 설정 (없으면 자동 활성화)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 사이트 파일 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
